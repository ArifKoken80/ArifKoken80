<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300">
<style>
.k{font:600 14px Consolas,'Fira Code',monospace;fill:#c9d1d9} .dots{font:14px Consolas,monospace;fill:#30363d}
.v{font:700 14px Consolas,monospace;opacity:0;animation:on .3s forwards} @keyframes on{to{opacity:1}}
.lbl{font:700 11px Consolas,monospace;fill:#00ff9c}
.sweep{transform-origin:160px 150px;animation:rot 4.0s linear infinite} @keyframes rot{to{transform:rotate(360deg)}}
.bl{opacity:.15;animation:blip 4.0s linear infinite}
@keyframes blip{0%{opacity:1}60%{opacity:.25}100%{opacity:.15}}
.ring{animation:ping 4.0s ease-out infinite} @keyframes ping{0%{transform:scale(1);opacity:1}25%{transform:scale(3.2);opacity:0}100%{opacity:0}}
.title{font:700 15px Consolas,monospace;fill:#14a3b8;letter-spacing:2px}
.live{fill:#ff2e63;animation:bk 1.2s infinite steps(1)} @keyframes bk{50%{opacity:0}}
</style>
<defs>
<radialGradient id="bg" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0b2a22"/><stop offset="1" stop-color="#0a0e14"/></radialGradient>
<linearGradient id="sw" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#00ff9c" stop-opacity="0"/><stop offset="1" stop-color="#00ff9c" stop-opacity=".45"/></linearGradient>
</defs>
<rect width="100%" height="100%" rx="12" fill="#0a0e14" stroke="#30363d"/>
<circle cx="160" cy="150" r="120" fill="url(#bg)" stroke="#00ff9c" stroke-opacity=".6"/>
<circle cx="160" cy="150" r="39.6" fill="none" stroke="#00ff9c" stroke-opacity=".18"/><circle cx="160" cy="150" r="79.2" fill="none" stroke="#00ff9c" stroke-opacity=".18"/>
<line x1="40" y1="150" x2="280" y2="150" stroke="#00ff9c" stroke-opacity=".18"/>
<line x1="160" y1="30" x2="160" y2="270" stroke="#00ff9c" stroke-opacity=".18"/>
<g class="sweep"><path d="M160,150 L160,30 A120,120 0 0,1 237.1,58.1 Z" fill="url(#sw)" transform="rotate(-40 160 150)"/>
<line x1="160" y1="150" x2="160" y2="30" stroke="#00ff9c" stroke-width="2"/></g>
<g class="bl" style="animation-delay:0.39s"><circle cx="202.7" cy="89.1" r="5" fill="#00ff9c"/><circle cx="202.7" cy="89.1" r="5" fill="none" stroke="#00ff9c" class="ring" style="animation-delay:0.39s;transform-origin:202.7px 89.1px"/><text x="211.7" y="93.1" class="lbl">WEB SEC</text></g><g class="bl" style="animation-delay:1.06s"><circle cx="255.6" cy="158.4" r="5" fill="#00ff9c"/><circle cx="255.6" cy="158.4" r="5" fill="none" stroke="#00ff9c" class="ring" style="animation-delay:1.06s;transform-origin:255.6px 158.4px"/><text x="264.6" y="162.4" class="lbl">SIEM</text></g><g class="bl" style="animation-delay:1.78s"><circle cx="182.6" cy="212.0" r="5" fill="#00ff9c"/><circle cx="182.6" cy="212.0" r="5" fill="none" stroke="#00ff9c" class="ring" style="animation-delay:1.78s;transform-origin:182.6px 212.0px"/><text x="191.6" y="216.0" class="lbl">PENTEST</text></g><g class="bl" style="animation-delay:2.39s"><circle cx="108.4" cy="223.7" r="5" fill="#00ff9c"/><circle cx="108.4" cy="223.7" r="5" fill="none" stroke="#00ff9c" class="ring" style="animation-delay:2.39s;transform-origin:108.4px 223.7px"/><text x="117.4" y="227.7" class="lbl">NETWORK</text></g><g class="bl" style="animation-delay:3.11s"><circle cx="106.8" cy="140.6" r="5" fill="#00ff9c"/><circle cx="106.8" cy="140.6" r="5" fill="none" stroke="#00ff9c" class="ring" style="animation-delay:3.11s;transform-origin:106.8px 140.6px"/><text x="115.8" y="144.6" class="lbl">LINUX</text></g><g class="bl" style="animation-delay:3.67s"><circle cx="118.0" cy="77.3" r="5" fill="#00ff9c"/><circle cx="118.0" cy="77.3" r="5" fill="none" stroke="#00ff9c" class="ring" style="animation-delay:3.67s;transform-origin:118.0px 77.3px"/><text x="127.0" y="81.3" class="lbl">PYTHON</text></g>
<circle cx="160" cy="150" r="3" fill="#00ff9c"/>
<text x="360" y="50" class="title">SECURITY OPERATIONS // STATUS</text>
<circle cx="680" cy="45" r="5" class="live"/><text x="692" y="50" style="font:700 12px Consolas,monospace;fill:#ff2e63">LIVE</text>
<line x1="360" y1="62" x2="820" y2="62" stroke="#14a3b8" stroke-opacity=".5"/>
<text x="360" y="95" class="k">THREAT LEVEL</text><text x="560" y="95" class="dots">..............</text><text x="720" y="95" class="v" fill="#00ff9c" style="animation-delay:0.0s">[ LOW ]</text><text x="360" y="125" class="k">FIREWALL</text><text x="560" y="125" class="dots">..............</text><text x="720" y="125" class="v" fill="#00ff9c" style="animation-delay:0.3s">[ ACTIVE ]</text><text x="360" y="155" class="k">SIEM</text><text x="560" y="155" class="dots">..............</text><text x="720" y="155" class="v" fill="#14a3b8" style="animation-delay:0.6s">[ MONITORING ]</text><text x="360" y="185" class="k">IDS ALERTS</text><text x="560" y="185" class="dots">..............</text><text x="720" y="185" class="v" fill="#00ff9c" style="animation-delay:0.9s">[ 0 CRITICAL ]</text><text x="360" y="215" class="k">OWASP TOP 10</text><text x="560" y="215" class="dots">..............</text><text x="720" y="215" class="v" fill="#14a3b8" style="animation-delay:1.2s">[ TESTED ]</text><text x="360" y="245" class="k">CCNA</text><text x="560" y="245" class="dots">..............</text><text x="720" y="245" class="v" fill="#f2cc60" style="animation-delay:1.5s">[ IN PROGRESS ]</text>
</svg>